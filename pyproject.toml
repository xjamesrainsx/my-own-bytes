[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]

name = "myownbytes"
version = "0.0.1.1"

description = "Light weight webhook server for catching plaid webhooks and a cli for data ingestion"

authors = [{ name = "oatsncrows", email = "xjames.rainsx@gmail.com" }]

requires-python = ">=3.13"


dependencies = [
    "cryptography>=50.0.1",
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "pyclean>=3.7.0",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "waitress>=3.0.2",
]

[tool.pytest.ini_options]
log_cli_level = "DEBUG"
log_cli = true
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

[tool.uv.workspace]
members = [
    "git",
]

[project.scripts]
wh-run = "myownbytes.webhook_server:serve"
wh-test = "myownbytes.webhook_server:test"
wh-dev = "myownbytes.webhook_server:dev"
plaid = "flask.cli:main"